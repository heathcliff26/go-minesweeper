---
name: Release + Changelog

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create draft release"
        type: boolean
        default: false
      update:
        description: "Update existing release"
        type: boolean
        default: false
      tag:
        description: "Release tag to use"
        type: string
        required: true
      prerelease:
        description: "Mark the release as a prerelease"
        type: boolean
        default: false

jobs:
  changelog:
    uses: heathcliff26/ci/.github/workflows/changelog.yaml@main
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
      overwrite: ${{ inputs.update }}
    secrets: inherit

  trigger-release:
    runs-on: ubuntu-latest
    needs: changelog
    permissions:
      actions: write
    steps:
      - name: Trigger release workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ inputs.tag }} \
            -f draft=${{ inputs.draft }} \
            -f update=${{ inputs.update }} \
            -f tag=${{ inputs.tag }} \
            -f prerelease=${{ inputs.prerelease }}
