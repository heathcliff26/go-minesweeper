---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: go-minesweeper

env:
  - CGO_ENABLED=1

builds:
  - id: linux
    goos:
      - linux
    goarch:
      - arm64
      - amd64
    tool: fyne-wrapper.sh
    flags:
      - --release
    env:
      - >-
        {{- if eq .Arch "amd64"}}CC=zig cc -target x86_64-linux-gnu.2.38 -isystem /usr/include -L/usr/lib/x86_64-linux-gnu{{- end }}
        {{- if eq .Arch "arm64"}}CC=zig cc -target aarch64-linux-gnu.2.38 -isystem /usr/include -L/usr/lib/aarch64-linux-gnu{{- end }}
      - >-
        {{- if eq .Arch "amd64"}}CXX=zig c++ -target x86_64-linux-gnu.2.38 -isystem /usr/include -L/usr/lib/x86_64-linux-gnu{{- end }}
        {{- if eq .Arch "arm64"}}CXX=zig c++ -target aarch64-linux-gnu.2.38 -isystem /usr/include -L/usr/lib/aarch64-linux-gnu{{- end }}
  - id: windows
    goos:
      - windows
    goarch:
      - arm64
      - amd64
    tool: fyne-wrapper.sh
    flags:
      - --release
    env:
      - >-
        {{- if eq .Arch "amd64"}}CC=zig cc -target x86_64-windows-gnu -Wdeprecated-non-prototype -Wl,--subsystem,windows{{- end }}
        {{- if eq .Arch "arm64"}}CC=zig cc -target aarch64-windows-gnu -Wdeprecated-non-prototype -Wl,--subsystem,windows{{- end }}
      - >-
        {{- if eq .Arch "amd64"}}CXX=zig c++ -target x86_64-windows-gnu -Wdeprecated-non-prototype -Wl,--subsystem,windows{{- end }}
        {{- if eq .Arch "arm64"}}CXX=zig c++ -target aarch64-windows-gnu -Wdeprecated-non-prototype -Wl,--subsystem,windows{{- end }}

archives:
  - id: tar
    ids:
      - linux
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ tolower .Os }}-{{ .Arch }}"
    files:
      - strip_parent: true
        src: "packages/*"
  - id: zip
    ids:
      - windows
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ tolower .Os }}-{{ .Arch }}"
    files:
      - none*
nfpms:
  - id: linux
    package_name: "{{ .ProjectName }}"
    file_name_template: "{{ .PackageName }}-linux-{{ .Arch }}"
    ids:
      - linux
    maintainer: Heathcliff <heathcliff@heathcliff.eu>
    description: |
      This is an implementation of minesweeper in golang, made with the ui framework fyne.io.
      I mainly created it because i was bored and wanted to create a gui app.
    license: Apache-2.0
    homepage: https://github.com/heathcliff26/{{ .ProjectName }}
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - dst: /usr/share/licenses/{{ .PackageName }}
        type: dir
      - dst: /usr/share/doc/{{ .PackageName }}
        type: dir
      - src: LICENSE
        dst: /usr/share/licenses/{{ .PackageName }}/LICENSE
      - src: README.md
        dst: /usr/share/doc/{{ .PackageName }}/README.md
      - src: packages/io.github.heathcliff26.{{ .PackageName }}.desktop
        dst: /usr/share/applications/io.github.heathcliff26.{{ .PackageName }}.desktop
      - src: packages/io.github.heathcliff26.{{ .PackageName }}.png
        dst: /usr/share/icons/hicolor/512x512/apps/io.github.heathcliff26.{{ .PackageName }}.png
      - src: packages/io.github.heathcliff26.{{ .PackageName }}.svg
        dst: /usr/share/icons/hicolor/scalable/apps/io.github.heathcliff26.{{ .PackageName }}.svg
      - src: io.github.heathcliff26.{{ .PackageName }}.metainfo.xml
        dst: /usr/share/metainfo/io.github.heathcliff26.{{ .PackageName }}.metainfo.xml
    rpm:
      summary: Minesweeper Game

changelog:
  disable: true
release:
  disable: true
